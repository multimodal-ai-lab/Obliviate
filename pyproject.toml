[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "obliviate"
version = "0.1.0"
description = "Concept Erasure for AR Image Generation Models"
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "accelerate>=1.10.1",
    "peft==0.17.1",
    "pillow>=11.3.0",
    "flash-attn==2.8.3 ; sys_platform == 'linux'",
    "torch==2.5.1",
    "torchvision>=0.20.1",
    "transformers==4.44.0", # before we had: "transformers>=4.56.1", changed for compatibility with Emu3
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "tiktoken>=0.12.0",  # Required for Emu3 tokenizer
    "clean-fid>=0.1.0",
    "nudenet>=1.0.0",
    "google-genai>=0.1.0",
    "python-dotenv>=1.0.0",
    "wandb>=0.16.0",
    "addict>=2.4.0",
    "timm>=1.0.24",
]

[tool.setuptools.packages.find]
exclude = ["tests*", "data*", "outputs*", "checkpoints*"]

[tool.uv.extra-build-dependencies]
flash-attn = [{ requirement = "torch", match-runtime = true }]

[tool.uv.extra-build-variables]
flash-attn = { FLASH_ATTENTION_SKIP_CUDA_BUILD = "TRUE" }

[dependency-groups]
dev = [
    "datasets<4.0.0",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.7",
    "pandas>=2.3.3",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'"
]


